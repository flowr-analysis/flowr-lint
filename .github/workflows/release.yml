permissions:
  contents: write
name: release
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - name: Configure git user
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

      - name: Bump version
        id: version
        run: npm version patch -m "[skip ci] Release %s"

      # publish before pushing: a failed publish must not leave a released
      # version commit and tag on main that never made it to the registry
      - name: Publish
        run: npm run publish-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version update commit
        run: |
          git push
          git push --tags
